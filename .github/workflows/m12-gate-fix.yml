name: M12 gate fix

on:
  push:
    branches:
      - ux/prompt-maestro-critical-pass
    paths:
      - .github/m12-gate-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/prompt-maestro-critical-pass
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply minimal gate fix
        run: node scripts/fix-m12-gate.mjs
      - name: Commit cleaned M12 baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: clean M12.1 gate baseline"
          git push origin HEAD:ux/prompt-maestro-critical-pass
