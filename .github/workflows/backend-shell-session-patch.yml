name: Backend shell session patch

on:
  push:
    branches:
      - ux/prompt-maestro-critical-pass
    paths:
      - .github/backend-shell-session-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/prompt-maestro-critical-pass
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Apply mechanical session patch
        run: node scripts/patch-backend-shell-session.mjs
      - name: Commit patched session
        run: |
          if git diff --quiet -- src/editor-project-session.ts; then
            echo "Session already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor-project-session.ts
          git commit -m "feat: persist backend shell through project session"
          git push origin HEAD:ux/prompt-maestro-critical-pass
