name: Backend shell finalize v2

on:
  push:
    branches:
      - ux/prompt-maestro-critical-pass
    paths:
      - .github/backend-shell-finalize-v2-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ux/prompt-maestro-critical-pass
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Finalize backend shell integration
        run: node scripts/finalize-backend-shell-v2.mjs
      - name: Commit clean product result
        run: |
          if git diff --quiet; then
            echo "No changes to finalize"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate editable admin shell"
          git push origin HEAD:ux/prompt-maestro-critical-pass
